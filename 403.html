<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>404 - Halaman Tidak Ditemukan</title>
  <style>
    :root {
      --orange-main: #f97316;
      --orange-dark: #ea580c;
      --orange-soft: #fff7ed;
      --gray-dark: #1f2937;
      --gray: #6b7280;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      min-height: 100vh;
      background: linear-gradient(135deg, var(--orange-soft), #ffffff);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--gray-dark);
    }

    .container {
      max-width: 1100px;
      width: 100%;
      padding: 40px;
    }

    .card {
      background: #ffffff;
      border-radius: 24px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.08);
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 40px;
      padding: 60px;
      align-items: center;
    }

    .content h1 {
      font-size: 96px;
      color: var(--orange-main);
      line-height: 1;
      margin-bottom: 16px;
    }

    .content h2 {
      font-size: 28px;
      margin-bottom: 16px;
    }

    .content p {
      color: var(--gray);
      line-height: 1.7;
      margin-bottom: 32px;
      max-width: 420px;
    }

    .actions {
      display: flex;
      gap: 16px;
      flex-wrap: wrap;
    }

    .btn {
      padding: 14px 28px;
      border-radius: 999px;
      text-decoration: none;
      font-weight: 600;
      transition: all 0.3s ease;
    }

    .btn-primary {
      background: var(--orange-main);
      color: #ffffff;
    }

    .btn-primary:hover {
      background: var(--orange-dark);
      transform: translateY(-2px);
    }

    .btn-outline {
      border: 2px solid var(--orange-main);
      color: var(--orange-main);
    }

    .btn-outline:hover {
      background: var(--orange-soft);
    }

    .illustration {
      position: relative;
      width: 100%;
      height: 100%;
    }

    .box {
      position: absolute;
      border-radius: 16px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.08);
    }

    .box.one {
      width: 220px;
      height: 140px;
      background: var(--orange-main);
      top: 0;
      left: 40px;
    }

    .box.two {
      width: 260px;
      height: 160px;
      background: #ffffff;
      border: 2px solid var(--orange-main);
      top: 120px;
      left: 120px;
    }

    .box.three {
      width: 180px;
      height: 120px;
      background: var(--orange-soft);
      top: 260px;
      left: 20px;
    }

    .icon {
      position: absolute;
      bottom: 20px;
      right: 20px;
      background: #ffffff;
      width: 64px;
      height: 64px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 10px 25px rgba(0,0,0,0.1);
      color: var(--orange-main);
      font-size: 28px;
      font-weight: bold;
    }

    .label {
      position: absolute;
      bottom: 28px;
      left: 28px;
      color: #ffffff;
      font-weight: 600;
      font-size: 16px;
    }

    @media (max-width: 900px) {
      .card {
        grid-template-columns: 1fr;
        padding: 40px 24px;
      }

      .content h1 {
        font-size: 72px;
      }

      .illustration {
        height: 360px;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="card">
      <div class="content">
        <h1>404</h1>
        <h2>Halaman Tidak Ditemukan</h2>
        <p>
          Maaf, halaman yang Anda cari tidak tersedia. 
          Tim outsourcing dan trading kami siap membantu Anda menemukan solusi bisnis yang tepat.
        </p>
        <div class="actions">
          <a href="/" class="btn btn-primary">Kembali ke Beranda</a>
          <a href="/contact" class="btn btn-outline">Hubungi Kami</a>
        </div>
      </div>

      <div class="illustration">
        <div class="box one">
          <div class="label">Outsourcing</div>
        </div>
        <div class="box two"></div>
        <div class="box three"></div>
        <div class="icon">↗</div>
      </div>
    </div>
  </div>
</body>
</html>
